# 免源码部署（预构建镜像）。
#   curl -O https://raw.githubusercontent.com/EasyIndie/EasySticker/main/docker-compose.image.yml
#   curl -o .env https://raw.githubusercontent.com/EasyIndie/EasySticker/main/.env.example
#   编辑 .env 后：docker compose -f docker-compose.image.yml up -d
# 升级：pull && up -d；锁版本：在 .env 设置 EASYSTICKER_TAG=<版本号>。
services:
  easysticker:
    image: ghcr.io/easyindie/easysticker:${EASYSTICKER_TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # 容器内固定端口与数据目录；其余变量由 .env 注入
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      # 深度定制时先创建宿主文件，再取消下一行注释
      # - ./prompt-config.json:/app/prompt-config.json:ro
    restart: unless-stopped

  # 可选：一次性数据回收，默认不运行。
  #   docker compose -f docker-compose.image.yml --profile cleanup run --rm cleanup
  cleanup:
    image: ghcr.io/easyindie/easysticker:${EASYSTICKER_TAG:-latest}
    profiles: [cleanup]
    command: node dist/cli/gc.js --apply
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: "no"
