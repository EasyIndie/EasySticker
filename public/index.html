<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasySticker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>EasySticker</h1>
        <p class="muted">自动化生成并打包表情资源（MVP）</p>
      </header>

      <section class="card">
        <h2>上传图片</h2>
        <form id="uploadForm">
          <input id="file" name="file" type="file" accept="image/png,image/jpeg" required />
          <button type="submit">上传</button>
        </form>
        <div class="stack">
          <div class="muted">预览</div>
          <img id="originalPreview" class="preview" alt="" />
        </div>
        <pre id="uploadResult" class="pre"></pre>
      </section>

      <section class="card">
        <h2>AI 生成微信表情（最小流程）</h2>
        <form id="wechatAiForm">
          <label class="inline">
            referenceAssetId
            <input id="wechatRefId" type="text" placeholder="默认用处理后/上传后的assetId" />
          </label>
          <label class="inline">
            stickerCount
            <input id="wechatAiCount" type="number" min="8" max="24" value="8" />
          </label>
          <label class="inline">
            styles
            <input id="wechatAiStyles" type="text" placeholder="扁平插画,3D卡通,日系Q版" />
          </label>
          <label class="inline">
            title
            <input id="wechatAiTitle" type="text" placeholder="可选" />
          </label>
          <button id="wechatAiSuggest" type="button">生成提示词</button>
          <button type="submit">生成并打包</button>
        </form>
        <label class="inline">
          prompt
          <input id="wechatAiPrompt" type="text" placeholder="在这里编辑提示词" />
        </label>
        <div id="wechatAiZipLink" class="stack"></div>
        <div id="wechatAiPreview" class="grid"></div>
        <pre id="wechatAiResult" class="pre"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
