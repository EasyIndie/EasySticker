<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EasySticker 管理后台</title>
  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

  <!-- ====== 登录界面 ====== -->
  <div id="login-section">
    <div class="admin-card login-card">
      <div class="login-logo">🧩</div>
      <h2>EasySticker 管理后台</h2>
      <div class="input-group">
        <label for="login-email">邮箱</label>
        <input id="login-email" type="email" placeholder="admin@easysticker.app" autocomplete="email">
      </div>
      <div class="input-group">
        <label for="login-password">密码</label>
        <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary" onclick="login()">登 录</button>
      <p id="login-error" class="error-msg"></p>
      <p class="login-back"><a href="/">← 返回首页</a></p>
    </div>
  </div>

  <!-- ====== 主界面 ====== -->
  <div id="main-section" style="display:none">

    <!-- 顶部导航 -->
    <header class="topbar">
      <div class="topbar-left">
        <a href="/" class="topbar-back" title="返回首页">←</a>
        <div class="topbar-brand">
          <span class="brand-icon">🧩</span>
          <span class="brand-name">EasySticker 管理后台</span>
        </div>
      </div>
      <div class="topbar-right">
        <span id="topbar-user" class="topbar-user"></span>
        <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
      </div>
    </header>

    <!-- Tab 切换 -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 仪表盘</button>
      <button class="tab-btn" data-tab="users" onclick="switchTab('users')">👥 用户</button>
      <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">📈 统计</button>
      <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ 设置</button>
    </nav>

    <!-- 内容区 -->
    <main class="content">

      <!-- ====== 📊 仪表盘 ====== -->
      <div id="dashboard-panel" class="tab-panel">

        <!-- 监控快照 -->
        <section class="metrics-grid">
          <div class="metric-card" id="metric-cpu">
            <h3 class="metric-title">CPU</h3>
            <div class="metric-ring">
              <svg viewBox="0 0 120 120" width="120" height="120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#eee" stroke-width="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73" transform="rotate(-90 60 60)"/>
              </svg>
              <div class="metric-ring-text"><span class="metric-ring-value">--</span><span class="metric-ring-unit">%</span></div>
            </div>
            <div class="metric-sub" id="metric-cpu-load"></div>
          </div>

          <div class="metric-card" id="metric-mem">
            <h3 class="metric-title">内存</h3>
            <div class="metric-ring">
              <svg viewBox="0 0 120 120" width="120" height="120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#eee" stroke-width="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73" transform="rotate(-90 60 60)"/>
              </svg>
              <div class="metric-ring-text"><span class="metric-ring-value">--</span><span class="metric-ring-unit">%</span></div>
            </div>
            <div class="metric-sub" id="metric-mem-detail"></div>
          </div>

          <div class="metric-card" id="metric-disk">
            <h3 class="metric-title">磁盘</h3>
            <div class="metric-ring">
              <svg viewBox="0 0 120 120" width="120" height="120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#eee" stroke-width="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73" transform="rotate(-90 60 60)"/>
              </svg>
              <div class="metric-ring-text"><span class="metric-ring-value">--</span><span class="metric-ring-unit">MB</span></div>
            </div>
            <div class="metric-sub" id="metric-disk-detail"></div>
          </div>

          <div class="metric-card" id="metric-requests">
            <h3 class="metric-title">请求/分钟</h3>
            <div class="metric-big-num">
              <span class="metric-num-value" id="metric-rpm-value">--</span>
            </div>
            <div class="metric-sub" id="metric-rpm-detail"></div>
          </div>
        </section>

        <!-- 告警列表 -->
        <section class="section-card">
          <div class="section-header">
            <h3>🚨 活跃告警</h3>
            <button class="btn btn-outline btn-sm" onclick="loadAlerts()">刷新</button>
          </div>
          <div id="alerts-container">
            <p class="loading-text">加载中...</p>
          </div>
        </section>
      </div>

      <!-- ====== 👥 用户管理 ====== -->
      <div id="users-panel" class="tab-panel" style="display:none">
        <section class="section-card">
          <div class="section-header">
            <h3>用户列表</h3>
            <button class="btn btn-outline btn-sm" onclick="loadUsers()">刷新</button>
          </div>
          <div id="users-container">
            <p class="loading-text">加载中...</p>
          </div>
        </section>
      </div>

      <!-- ====== 📈 统计 ====== -->
      <div id="stats-panel" class="tab-panel" style="display:none">

        <!-- 今日概览 -->
        <section class="stats-overview" id="stats-overview">
          <div class="stat-card stat-total"><h4>总生成</h4><span id="stat-total-generated">--</span></div>
          <div class="stat-card stat-success"><h4>成功</h4><span id="stat-total-success">--</span></div>
          <div class="stat-card stat-fail"><h4>失败</h4><span id="stat-total-fail">--</span></div>
          <div class="stat-card stat-rate"><h4>成功率</h4><span id="stat-total-rate">--</span></div>
        </section>

        <!-- 使用趋势 -->
        <section class="section-card">
          <h3>📊 请求趋势</h3>
          <div class="chart-container">
            <svg id="chart-requests" viewBox="0 0 700 200" preserveAspectRatio="none" width="100%" height="200"></svg>
          </div>
          <p id="chart-requests-empty" class="empty-text" style="display:none">暂无数据</p>
        </section>

        <!-- 系统趋势 -->
        <section class="section-card">
          <h3>📈 系统资源</h3>
          <div class="chart-container">
            <svg id="chart-system" viewBox="0 0 700 200" preserveAspectRatio="none" width="100%" height="200"></svg>
          </div>
          <p id="chart-system-empty" class="empty-text" style="display:none">暂无数据</p>
        </section>
      </div>

      <!-- ====== ⚙️ 设置 ====== -->
      <div id="settings-panel" class="tab-panel" style="display:none">

        <!-- Webhook 设置 -->
        <section class="section-card">
          <div class="section-header">
            <h3>📡 通知设置</h3>
            <button class="btn btn-primary btn-sm" onclick="saveSettings()">保存设置</button>
          </div>
          <div class="form-grid">
            <div class="input-group">
              <label for="setting-webhook-url">Webhook URL</label>
              <input id="setting-webhook-url" type="text" placeholder="https://hooks.example.com/alert">
            </div>
            <div class="input-group">
              <label for="setting-webhook-enabled">Webhook 启用</label>
              <div class="checkbox-wrap">
                <input type="checkbox" id="setting-webhook-enabled">
                <span>启用 Webhook 通知</span>
              </div>
            </div>
            <div class="input-group">
              <label for="setting-retention">监控数据保留天数</label>
              <input id="setting-retention" type="number" min="1" max="365" value="7">
            </div>
          </div>
          <p id="settings-msg" class="status-msg"></p>
        </section>

        <!-- 告警规则 -->
        <section class="section-card">
          <div class="section-header">
            <h3>🔔 告警规则</h3>
            <button class="btn btn-primary btn-sm" onclick="saveAlertRules()">保存规则</button>
          </div>
          <div id="alert-rules-container">
            <p class="loading-text">加载中...</p>
          </div>
          <p id="rules-msg" class="status-msg"></p>
        </section>
      </div>

    </main>
  </div>

  <script src="admin.js?v=2"></script>
</body>
</html>
