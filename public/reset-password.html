<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 - EasySticker</title>
  <link rel="stylesheet" href="/styles.css?v=f6c0e734" />
  <style>
    body { background: var(--bg) !important; }
  </style>
</head>
<body>
  <main class="page" style="max-width: 480px; margin: 60px auto; padding: 0 16px;">
    <div class="card" style="padding: 32px;">
      <h1 style="margin: 0 0 8px;">重置密码</h1>
      <p class="muted" style="margin: 0 0 24px;">请输入你的新密码。</p>

      <form id="resetForm">
        <input type="hidden" id="token" />
        <div class="field">
          <label for="password">新密码</label>
          <input type="password" id="password" minlength="6" required placeholder="至少 6 个字符" />
        </div>
        <div class="field">
          <label for="confirm">确认新密码</label>
          <input type="password" id="confirm" minlength="6" required placeholder="再次输入新密码" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">重置密码</button>
      </form>

      <div id="message" class="notice" hidden style="margin-top: 16px;"></div>

      <p style="margin-top: 24px; text-align: center;">
        <a href="/login.html">返回登录</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const tokenInput = document.getElementById('token');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const messageEl = document.getElementById('message');

    // Extract token from URL
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (token) {
      tokenInput.value = token;
    } else {
      messageEl.hidden = false;
      messageEl.textContent = '无效的链接：缺少重置令牌。';
      messageEl.className = 'notice notice-error';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.hidden = true;

      const password = passwordInput.value;
      const confirm = confirmInput.value;
      const token = tokenInput.value;

      if (!token) return;

      if (password !== confirm) {
        showMessage('两次输入的密码不一致。', 'error');
        return;
      }
      if (password.length < 6) {
        showMessage('密码至少 6 个字符。', 'error');
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password-with-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showMessage('✅ 密码已重置成功，请用新密码登录。', 'success');
          form.querySelector('button').disabled = true;
          setTimeout(() => { location.href = '/login.html'; }, 3000);
        } else {
          showMessage(data.message || '重置失败，链接可能已过期。', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请重试。', 'error');
      }
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'notice notice-' + type;
      messageEl.hidden = false;
    }
  </script>
</body>
</html>
