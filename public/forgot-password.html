<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘记密码 - EasySticker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page" style="max-width: 480px; margin: 60px auto; padding: 0 16px;">
    <div class="card" style="padding: 32px;">
      <h1 style="margin: 0 0 8px;">忘记密码</h1>
      <p class="muted" style="margin: 0 0 24px;">输入你的注册邮箱，我们将发送密码重置链接。</p>

      <form id="forgotForm">
        <div class="field">
          <label for="email">邮箱</label>
          <input type="email" id="email" required placeholder="your@email.com" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">发送重置链接</button>
      </form>

      <div id="forgotMsg" class="notice" hidden style="margin-top: 16px;"></div>

      <p style="margin-top: 24px; text-align: center;">
        <a href="/login.html">返回登录</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgotForm');
    const msgEl = document.getElementById('forgotMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.hidden = true;
      const email = document.getElementById('email').value;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        // Always show success to prevent email enumeration
        showMsg(data.message || '如果该邮箱已注册，你将收到重置邮件。', 'success');
        document.getElementById('email').value = '';
      } catch (err) {
        showMsg('网络错误，请重试。', 'error');
      }
    });

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'notice notice-' + type;
      msgEl.hidden = false;
    }
  </script>
</body>
</html>
