services:
  easysticker:
    build: .
    container_name: easysticker
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Production security — set these via .env or host env
      - API_TOKEN=${API_TOKEN:-}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-30}
      - DAILY_QUOTA_MAX=${DAILY_QUOTA_MAX:-100}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_DIR=${DATA_DIR:-/app/data}
    volumes:
      - ./data:/app/data
      - ./prompt-config.json:/app/prompt-config.json
    restart: unless-stopped

  # Optional: daily cleanup of old temp files (disabled by default, enable via profile)
  cleanup:
    build: .
    container_name: easysticker-cleanup
    profiles:
      - cleanup
    command: node scripts/cleanup.mjs --days 7
    volumes:
      - ./data:/app/data
    restart: "no"
