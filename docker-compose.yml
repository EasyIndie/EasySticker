# 从源码构建部署。免源码部署见 docker-compose.image.yml。
# 首次使用：cp .env.example .env，填好 API_TOKEN / JWT_SECRET / ADMIN_PASSWORD。
services:
  easysticker:
    build: .
    image: easysticker:local
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # 容器内固定端口与数据目录；其余变量由 .env 注入
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      # 深度定制时先创建宿主文件，再取消下一行注释
      # - ./prompt-config.json:/app/prompt-config.json:ro
    restart: unless-stopped

  # 可选：一次性数据回收，默认不运行。
  #   docker compose --profile cleanup run --rm cleanup
  cleanup:
    build: .
    image: easysticker:local
    profiles: [cleanup]
    command: node dist/cli/gc.js --apply
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: "no"
